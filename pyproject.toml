[project]
name = "claude-zotero-mcp"
version = "0.1.0"
description = "MCP server that lets Claude search and read your Zotero library"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=2,<3", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest", "respx"]

[project.scripts]
claude-zotero-mcp = "zotero_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zotero_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
